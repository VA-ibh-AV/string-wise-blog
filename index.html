    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so the prerendered markup
      // doesn't flash before React hydrates.
      //
      // The site is designed dark-first, so an unknown visitor gets dark
      // regardless of their OS preference; only an explicit choice, saved from
      // the header toggle, moves them to light. ThemeToggle in Layout.jsx must
      // resolve this identically or hydration mismatches.
      (function () {
        try {
          var saved = localStorage.getItem('string-wise-theme')
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Routes are prerendered to <route>/index.html at build time, so serve those
    # first. Anything unrecognised gets a real 404 status (not a soft 404) with
    # the SPA shell as the body, so React still renders the not-found page.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Prerendered HTML must not be cached hard, or a new post ships stale.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
}
